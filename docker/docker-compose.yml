# Run from repo root:
#   docker compose -f docker/docker-compose.yml up --build -d
# or: npm run docker:up

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - finora_mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/finora_ai}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  finora_mongo_data:
