<div class="finora-page">
  <div class="finora-page-header">
    <div>
      <h2 class="finora-page-title">Settings</h2>
      <p class="finora-page-subtitle">Profile, theme, security, and account controls.</p>
    </div>
  </div>

  <div class="grid gap-4 lg:grid-cols-2">
    <finora-card title="Profile" subtitle="How Finora personalizes your experience">
      <form class="flex flex-col gap-3" [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium">Name</span>
          <input class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="name" />
        </label>
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium">Email</span>
          <input class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface-2)] px-3 py-2.5" [value]="user()?.email || ''" disabled />
        </label>
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="flex flex-col gap-1 text-sm">
            <span class="font-medium">Currency</span>
            <select class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="currency">
              @for (c of currencies; track c) {
                <option [value]="c">{{ c }}</option>
              }
            </select>
          </label>
          <label class="flex flex-col gap-1 text-sm">
            <span class="font-medium">Timezone</span>
            <input class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="timezone" />
          </label>
        </div>
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium">Monthly income</span>
          <input type="number" class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="monthlyIncome" />
        </label>
        <finora-button type="submit" [loading]="savingProfile()">Save profile</finora-button>
      </form>
    </finora-card>

    <div class="flex flex-col gap-4">
      <finora-card title="Appearance" subtitle="Light by default — dark when you want focus">
        <div class="flex items-center justify-between gap-3">
          <div>
            <div class="font-medium">Theme</div>
            <p class="finora-muted m-0 text-sm">Currently {{ isDark() ? 'dark' : 'light' }}</p>
          </div>
          <finora-button variant="secondary" (clicked)="toggleTheme()">
            Switch to {{ isDark() ? 'light' : 'dark' }}
          </finora-button>
        </div>
      </finora-card>

      <finora-card title="Change password">
        <form class="flex flex-col gap-3" [formGroup]="passwordForm" (ngSubmit)="changePassword()">
          <label class="flex flex-col gap-1 text-sm">
            <span class="font-medium">Current password</span>
            <input type="password" class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="currentPassword" />
          </label>
          <label class="flex flex-col gap-1 text-sm">
            <span class="font-medium">New password</span>
            <input type="password" class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="newPassword" />
          </label>
          <finora-button type="submit" [loading]="savingPassword()">Update password</finora-button>
        </form>
      </finora-card>

      <finora-card title="Danger zone" subtitle="Irreversible actions">
        <finora-alert tone="danger" title="Delete account">
          This removes your Finora account and associated financial data.
        </finora-alert>
        <div class="mt-3">
          <finora-button variant="danger" [loading]="deleting()" (clicked)="deleteAccount()">Delete account</finora-button>
        </div>
      </finora-card>
    </div>
  </div>
</div>
