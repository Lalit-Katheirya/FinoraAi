<finora-modal
  [open]="open"
  [title]="transaction ? 'Edit transaction' : 'Add transaction'"
  subtitle="Keep records clear and categorized."
  (close)="closed.emit()"
>
  <form class="flex flex-col gap-3" [formGroup]="form" (ngSubmit)="submit()">
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium">Account</span>
      <select class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="accountId">
        @for (a of accounts; track a.id) {
          <option [value]="a.id">{{ a.name }}</option>
        }
      </select>
    </label>
    <div class="grid gap-3 sm:grid-cols-2">
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium">Type</span>
        <select class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
          <option value="transfer">Transfer</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium">Amount</span>
        <input type="number" step="0.01" min="0" class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="amount" />
      </label>
    </div>
    <div class="grid gap-3 sm:grid-cols-2">
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium">Category</span>
        <select class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="categoryName">
          <option value="">Select</option>
          @for (c of categories; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium">Date</span>
        <input type="date" class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="transactionDate" />
      </label>
    </div>
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium">Merchant</span>
      <input class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="merchant" />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium">Description</span>
      <input class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="description" />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium">Notes</span>
      <textarea rows="2" class="rounded-xl border border-[var(--finora-border)] bg-[var(--finora-surface)] px-3 py-2.5" formControlName="notes"></textarea>
    </label>

    <div class="mt-4 flex justify-end gap-2">
      <finora-button type="button" variant="secondary" (clicked)="closed.emit()">Cancel</finora-button>
      <finora-button type="submit" [loading]="saving()">Save</finora-button>
    </div>
  </form>
</finora-modal>
